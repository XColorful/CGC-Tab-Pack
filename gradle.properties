# .properties only supports full-line comments, and values must be ASCII (use \uXXXX escapes).
# .properties 只支持整行注释，值里不能写行内 #；非 ASCII 字符请使用 \uXXXX 转义

# --------Mod metadata / 模组元数据--------
mod_id=customguntab
mod_name=Custom Gun Continued Tab Pack
# For pure data/resource pack mods, the mod license also serves as the resource pack license.
# 对于纯数据包/资源包模组，模组协议同时作为资源包协议
mod_license=CC-BY-SA-4.0
# Gun pack version
# 枪包版本
mod_version=26.10.32
mod_display_url=https://github.com/XColorful/CGC-Tab-Pack
mod_logo_file=pack.png
# Credits
# 鸣谢列表
mod_credits=Endesga 64
# Gun pack authors
# 枪包作者
mod_authors=XiaoColorful
# Gun pack description
# 枪包介绍
mod_description=Custom Gun Continued creative tab icons
# Whether the mod jar is shown as a resource pack in the game.
# 模组 jar 是否在游戏内作为资源包显示
show_as_resource_pack=false

# Package of the generated ExampleForge / ExampleNeoforge entry classes; same as mod_group_id in the Forge/NeoForge MDKs.
# 生成的 ExampleForge / ExampleNeoforge 入口类所在包名，等同于 Forge/NeoForge MDK 的 mod_group_id
mod_group_id=dev.xcolorful.customguntab


# --------Pack metadata / 资源包元数据--------

# Gun packs support any MC version, so this only affects the "incompatible" warning on non-target versions.
# 由于枪包支持任意 MC 版本，该值仅影响非目标版本的“不兼容警告”
pack_description=Custom Gun Continued creative tab icons
pack_format=999

# Date filled into gunpack_info.json ${pack_date}; leave empty to use today's YYYY-MM-DD.
# 填入 gunpack_info.json ${pack_date} 的日期，留空则使用当天 YYYY-MM-DD
pack_date=
# Authors filled into gunpack_info.json ${pack_authors}; write them as raw JSON array content.
# 填入 gunpack_info.json ${pack_authors} 的作者，按 JSON 数组内容填写
pack_authors="XiaoColorful", "Endesga 64"


# --------Build output / 构建产物--------

# Output file name under build/libs; the jar gets no suffix, the packs get -datapack / -resourcepack.
# 生成在 build/libs 下的文件名，jar 无后缀，数据包和资源包会自动补充 -datapack、-resourcepack
file_name=customgun-tab-pack
